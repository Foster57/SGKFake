<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Thông tin cá nhân</title>
    <link rel="stylesheet" href="/asset/asset/user-profile.css">
</head>

<body>
    <div class="profile-container">
        <div class="profile-header">
            <div class="avatar-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M7.5 6a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 22.5c-2.786 0-5.433-.6-7.812-1.7a.75.75 0 01-.437-.695z"
                        clip-rule="evenodd" />
                </svg>
            </div>
            <h1>Thông tin cá nhân</h1>
        </div>

        <div class="profile-body">
            <div class="info-group">
                <label>Tài khoản</label>
                <div class="info-value" id="display-account">Đang tải...</div>
            </div>

            <div class="info-group">
                <label>Email</label>
                <div class="info-value" id="display-email">Đang tải...</div>
            </div>
        </div>

        <div class="profile-footer">
            <a href="/user" class="btn-back">Quay lại trang chủ</a>
        </div>
    </div>

    <script src="/src/auth.js"></script>
    <script src="/src/route-guard.js" data-require-auth="true"></script>
    <script>
        async function loadProfile() {
            const accountEl = document.getElementById('display-account');
            const emailEl = document.getElementById('display-email');

            if (window.SGKAuth && SGKAuth.getAccessToken()) {
                try {
                    const res = await SGKAuth.authFetch('/api/users/profile');
                    if (res.ok) {
                        const user = await res.json();
                        accountEl.textContent = user.user_account || 'Không có';
                        emailEl.textContent = user.email || 'Không có';
                        localStorage.setItem('userData', JSON.stringify(user));
                        return;
                    }
                } catch (err) {
                    console.error('Lỗi khi tải thông tin từ JWT API:', err);
                }
            }

            // Fallback nếu không có token hoặc API offline: Lấy từ localStorage
            const userData = JSON.parse(localStorage.getItem('userData'));
            if (userData) {
                accountEl.textContent = userData.user_account || 'Không có';
                emailEl.textContent = userData.email || 'Không có';
            } else {
                accountEl.textContent = 'Chưa đăng nhập';
                emailEl.textContent = 'Chưa đăng nhập';
            }
        }
        window.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>

</html>
