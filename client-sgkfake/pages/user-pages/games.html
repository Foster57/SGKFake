<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>SGKFake - Trò chơi học tập</title>
    <link rel="stylesheet" href="/asset/asset/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <style>
        .game-page-container {
            max-width: 1280px;
            margin: 20px auto;
            padding: 0 24px;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 120px);
            min-height: 550px;
            border-radius: 16px;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <div>
        <header class="header">
            <ul class="header-left">
                <li><img src="/img/img-home/icon.education.jpeg" class="logo-gd" alt="GD Logo"></li>
                <li><img src="/img/img-home/logo-olm.png" class="logo-olm" alt="OLM Logo"></li>
            </ul>

            <ul class="header-right">
                <li>
                    <a href="/user/books" class="btn-bookstore">
                        <i class="ri-book-shelf-line"></i>
                        <span>Tủ sách</span>
                    </a>
                </li>
                <li>
                    <a href="/user/games" class="btn-games">
                        <i class="ri-gamepad-line"></i>
                        <span>Trò chơi</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="icon-btn" title="Thông báo">
                        <i class="ri-notification-3-line"></i>
                    </a>
                </li>
                <li>
                    <div class="user-menu-wrapper">
                        <div class="user-avatar-btn">
                            <i class="ri-user-3-fill"></i>
                        </div>
                        <div class="user-dropdown">
                            <ul>
                                <li><a href="/user/profile"><i class="ri-user-line"></i> Thông tin cá nhân</a></li>
                                <li><a href="/user/reset-password"><i class="ri-lock-password-line"></i> Đổi mật
                                        khẩu</a></li>
                                <li><a href="/login" id="logout-btn"><i class="ri-logout-box-r-line"></i> Đăng xuất</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </li>
            </ul>
        </header>
    </div>

    <div class="game-page-container">
        <div class="game-header-bar"
            style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; background: #ffffff; padding: 14px 20px; border-radius: 14px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); flex-wrap: wrap; gap: 12px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 28px;">🧪</span>
                <div>
                    <h2 style="font-size: 18px; font-weight: 700; color: #1e293b; margin: 0;">Trò chơi học tập</h2>
                    <p style="font-size: 13px; color: #64748b; margin: 2px 0 0 0;">Nhận biết và tổng hợp kiến thức thông
                        qua trò chơi</p>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <button id="reload-game-btn" title="Tải lại game"
                    style="padding: 8px 14px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: 600; cursor: pointer; color: #334155; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; transition: all 0.2s;">
                    <i class="ri-refresh-line"></i> Tải lại
                </button>
                <button id="fullscreen-game-btn" title="Toàn màn hình"
                    style="padding: 8px 14px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: 600; cursor: pointer; color: #334155; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; transition: all 0.2s;">
                    <i class="ri-fullscreen-line"></i> Toàn màn hình
                </button>
                <a href="https://foster57.github.io/GameSGK/" target="_blank" rel="noopener noreferrer"
                    title="Mở ở tab mới"
                    style="padding: 8px 14px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; font-weight: 600; text-decoration: none; color: #2563eb; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; transition: all 0.2s;">
                    <i class="ri-external-link-line"></i> Tab mới
                </a>
            </div>
        </div>

        <div class="iframe-container" id="game-iframe-wrapper">
            <iframe id="game-iframe" src="https://foster57.github.io/GameSGK/" title="Trò chơi học tập SGKFake"
                allow="fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <script src="/src/auth.js"></script>
    <script src="/src/route-guard.js" data-require-auth="true"></script>
    <script>
        // Dropdown menu handler
        const userMenu = document.querySelector('.user-menu-wrapper');
        const userDropdown = document.querySelector('.user-dropdown');
        if (userMenu && userDropdown) {
            let timeoutID;
            userMenu.addEventListener('mouseenter', () => { clearTimeout(timeoutID); userDropdown.style.display = 'block'; });
            userMenu.addEventListener('mouseleave', () => { timeoutID = setTimeout(() => { userDropdown.style.display = 'none'; }, 200); });
            const userAvatarBtn = userMenu.querySelector('.user-avatar-btn');
            if (userAvatarBtn) {
                userAvatarBtn.addEventListener('click', (e) => { e.stopPropagation(); const isVisible = userDropdown.style.display === 'block'; userDropdown.style.display = isVisible ? 'none' : 'block'; });
            }
            document.addEventListener('click', (e) => { if (!userMenu.contains(e.target)) userDropdown.style.display = 'none'; });
        }
        // Logout handler
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                if (window.SGKAuth) await SGKAuth.logout();
                else localStorage.removeItem('userData');
                window.location.href = '/login';
            });
        }

        // Game iframe controls
        const reloadBtn = document.getElementById('reload-game-btn');
        const fullscreenBtn = document.getElementById('fullscreen-game-btn');
        const gameIframe = document.getElementById('game-iframe');
        const iframeWrapper = document.getElementById('game-iframe-wrapper');

        if (reloadBtn && gameIframe) {
            reloadBtn.addEventListener('click', () => {
                gameIframe.src = gameIframe.src;
            });
        }

        if (fullscreenBtn && iframeWrapper) {
            fullscreenBtn.addEventListener('click', () => {
                if (iframeWrapper.requestFullscreen) {
                    iframeWrapper.requestFullscreen();
                } else if (iframeWrapper.webkitRequestFullscreen) {
                    iframeWrapper.webkitRequestFullscreen();
                } else if (iframeWrapper.msRequestFullscreen) {
                    iframeWrapper.msRequestFullscreen();
                }
            });
        }
    </script>
</body>

</html>
