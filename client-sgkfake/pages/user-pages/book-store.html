<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>SGKFake - Tủ Sách</title>
    <link rel="stylesheet" href="/asset/asset/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <div>
        <header class="header">
            <ul class="header-left">
                <li><img src="/img/img-home/icon.education.jpeg" class="logo-gd" alt="GD Logo"></li>
                <li><img src="/img/img-home/logo-olm.png" class="logo-olm" alt="OLM Logo"></li>
            </ul>

            <ul class="header-right">
                <li>
                    <a href="/user" class="btn-bookstore">
                        <i class="ri-home-4-line"></i>
                        <span>Trang chủ</span>
                    </a>
                </li>
            </ul>
        </header>
    </div>

    <div class="main-content" style="padding-top: 32px;">
        <div style="width: 100%; min-width: 0;">
            <h1 style="font-size: 24px; font-weight: 700; margin-bottom: 20px; color: #1e293b;">Tủ Sách Của Tôi</h1>
            <div class="book-grid" id="bookGrid">
                <p class="empty-state">Tủ sách hiện chưa có sách nào được lưu.</p>
            </div>
        </div>
    </div>

    <script src="/src/auth.js"></script>
    <script src="/src/route-guard.js" data-require-auth="true"></script>
</body>

</html>
