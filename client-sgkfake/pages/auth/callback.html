<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang đăng nhập...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .loading-card {
            background: #fff;
            padding: 32px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="loading-card">
        <div class="spinner"></div>
        <div>Đang xác thực, vui lòng chờ...</div>
    </div>
    <script src="../../src/auth.js"></script>
    <script>
        (async function () {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (!code) {
                alert('Không nhận được mã xác thực.');
                window.location.href = '/login';
                return;
            }

            try {
                const response = await SGKAuth.authFetch('/api/users/exchange', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ code })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Xác thực thất bại');
                }

                if (data.accessToken) {
                    localStorage.setItem('accessToken', data.accessToken);
                }
                if (data.user) {
                    localStorage.setItem('userData', JSON.stringify(data.user));
                }

                const targetURL = data.user.role === 'admin' ?
                    '/admin' 
                    : '/user';
                window.location.href = targetURL;
            } catch (err) {
                console.error('Exchange error:', err);
                alert(err.message || 'Đăng nhập thất bại, vui lòng thử lại.');
                window.location.href = '/login';
            }
        })();
    </script>
</body>

</html>
