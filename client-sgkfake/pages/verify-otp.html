<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <link rel="stylesheet" href="/asset/asset/sign-in.css">
</head>

<body>
    <div class="container">
        <div class="form-container">
            <h1>Verify OTP</h1>
            <form id="verifyForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required readonly>
                </div>
                <div class="form-group">
                    <label for="otp">OTP Code</label>
                    <input type="text" id="otp" name="otp" placeholder="Enter 6-character OTP" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required>
                </div>
                <button type="submit">Reset Password</button>
            </form>
            <div style="margin-top: 16px; text-align: center;">
                <a class="back-to-signin" href="/pages/sign-in.html">Back to Sign In</a>
            </div>
        </div>
    </div>
    <script src="/src/client-verify-otp.js"></script>
</body>

</html>
